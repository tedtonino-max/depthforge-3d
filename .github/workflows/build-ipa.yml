name: Build DepthForge 3D IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Test production fusion and photo selection
        run: swift test -c release

      - name: Parse iPad app sources
        run: swiftc -frontend -parse Sources/*.swift Sources/Core/*.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPadOS app
        run: |
          xcodebuild \
            -project DepthForge3D.xcodeproj \
            -scheme DepthForge3D \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/DepthForge3D.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload DepthForge3D-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: depthforge3d-unsigned-ipa
          path: DepthForge3D-unsigned.ipa
          if-no-files-found: error
