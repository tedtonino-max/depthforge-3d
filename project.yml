name: DepthForge3D
options:
  bundleIdPrefix: com.depthforge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "2"
    SUPPORTS_MACCATALYST: NO
targets:
  DepthForge3D:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.depthforge.scanner
        INFOPLIST_KEY_CFBundleDisplayName: DepthForge 3D
        INFOPLIST_KEY_NSCameraUsageDescription: DepthForge gebruikt de camera en LiDAR om lokaal 3D-scans vast te leggen.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: DepthForge kan een scanexport in je fotobibliotheek bewaren.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: DepthForge3D.entitlements
